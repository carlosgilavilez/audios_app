<div class="palma-audio-library" data-palma-audio-library>
  <iframe src="https://audios.iglesiapalma.org/audios?view=table&amp;embed=1" title="Biblioteca de Audios"></iframe>
</div>

<script>
(() => {
  const container = document.querySelector('[data-palma-audio-library]');
  if (!container) return;

  // Theme Builder uses a different header from the classic #main-header.
  // The footer follows this section; do not subtract its full height.
  const headers = document.querySelectorAll('#main-header, .et-l--header, .et-l--header .et_pb_section, #wpadminbar');
  let scheduled = false;
  let headerOffset = 0;
  const updateHeight = () => {
    scheduled = false;
    const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    let headerBottom = 0;
    headers.forEach((header) => {
      const position = getComputedStyle(header).position;
      const rect = header.getBoundingClientRect();
      if ((position === 'fixed' || position === 'sticky') && rect.top <= viewportHeight && rect.bottom > 0) {
        headerBottom = Math.max(headerBottom, rect.bottom);
      }
    });
    // Divi can start the desktop module above the bottom of its fixed header.
    const documentTop = container.getBoundingClientRect().top + window.scrollY - headerOffset;
    const nextOffset = Math.max(0, Math.ceil(headerBottom - documentTop));
    if (nextOffset !== headerOffset) {
      container.style.marginTop = nextOffset + 'px';
      headerOffset = nextOffset;
    }
    const top = Math.max(0, headerBottom, container.getBoundingClientRect().top);
    container.style.height = Math.max(180, Math.floor(viewportHeight - top)) + 'px';
  };
  const scheduleUpdate = () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(updateHeight);
  };
  scheduleUpdate();
  window.addEventListener('load', scheduleUpdate);
  window.addEventListener('resize', scheduleUpdate);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleUpdate);
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(scheduleUpdate);
    headers.forEach((header) => observer.observe(header));
  }
})();
</script>
